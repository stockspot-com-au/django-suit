{% if show %}
  <nav class="xfull date-hierarchy">
    <ol class="toplinks breadcrumb">
      {% if back %}
        <li class="breadcrumb-item date-back"><a href="{{ back.link }}">&lsaquo; {{ back.title }}</a></li>
      {% endif %}
      {% for choice in choices %}
        <li class="breadcrumb-item">{% if choice.link %}<a href="{{ choice.link }}">{{ choice.title }}</a>{% else %}{{ choice.title }}{% endif %}</li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
